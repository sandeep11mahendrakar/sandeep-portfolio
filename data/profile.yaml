projects:
  - slug: "vision-ui-testing"
    number: 01
    title: "Autonomous-web-UI-testing-as-MCP-tools-for-AI-agents"
    year: "2025 – Present"
    type: "Personal Project"
    summary: "An MCP server that lets AI agents autonomously test any website. Two independent explorers — one reading the DOM, one reading screenshots via YOLO + OCR — merge into grounded, live-executed test cases, with every result classified pass/fail."
    details: "Validated across a 40-site evaluation campaign (demo apps to real e-commerce, banking, docs, and news platforms): 98 fusion tests generated and live-executed (56 pass / 42 fail, all classified), with fusion-attributable coverage averaging 48.7% and reaching 100% on some real sites — plus an independent adversarial audit where every headline number recomputes from raw artifacts. The idea originated from discussions with the capstone team; the architecture was independently redesigned and the entire codebase, evaluation, and audit were built solo."
    stack:
      - "Python"
      - "Node.js"
      - "MCP (Model Context Protocol)"
      - "Playwright"
      - "Appium"
      - "YOLO"
      - "Tesseract OCR"
      - "Gemini API"
      - "Grok API"
    link: "https://github.com/sandeep11mahendrakar/Autonomous-web-UI-testing-as-MCP-tools-for-AI-agents"
    media:
      type: "image"
      src: "/projects/vision-ui-testing/preview.png"
      alt: "Vision pipeline detecting and labeling UI elements on a live web page"

  - slug: "sentiment-analysis"
    number: 02
    title: "Lilly Fashion Muse"
    year: "2026 – Present"
    type: "Personal Project"
    summary: "A review-sentiment engine that scores product reviews 1–10 and abstains (\"UNSURE / MIXED\") instead of guessing on ambiguous text. A separate aspect-based model scores quality, price, and fit independently per sentence."
    details: "Confidence-gated DistilBERT reaches 91.2% accuracy at 86.2% coverage (macro-F1 .715) by abstaining under a calibrated threshold rather than forcing a guess. A 199-review human-labeling study found inter-annotator agreement was near-chance (κ ≈ 0.15), which shaped the decision to prioritize calibration over raw accuracy. Two open-weight models — doc-level and aspect-based (ABSA) — are released on the Hugging Face Hub, alongside a FastAPI + JS webapp for single-review and batch-CSV scoring."
    stack:
      - "Python"
      - "DistilBERT"
      - "Hugging Face Transformers"
      - "FastAPI"
      - "JavaScript"
      - "scikit-learn"
      - "LIME"
    link: "https://github.com/sandeep11mahendrakar/Lilly-Fashion-Muse"

  - slug: "rag-answer-engine"
    number: 03
    title: "RAG-based Answer Engine"
    year: "2026 – Present"
    type: "Project"
    summary: "A hybrid retrieval pipeline combining BM25 and FAISS with DistilBERT-based intent classification and cross-encoder reranking for accurate, source-grounded answers."
    stack:
      - "Python"
      - "BM25"
      - "FAISS"
      - "DistilBERT"
      - "RAG"

  - slug: "linux-kernel-bug"
    number: 04
    title: "Linux Kernel Bug Report — btusb/btmtk MT7921"
