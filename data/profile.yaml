    summary: "Diagnosed a Bluetooth audio failure on Fedora Linux (PipeWire/WirePlumber/BlueZ on a MediaTek MT7921 chipset) and filed an upstream kernel bug — confirmed accurate by the maintainer, with a fix pending in an upcoming release."
