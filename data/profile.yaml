      alt: "Vision pipeline detecting and labeling UI elements on a live web page"

  - slug: "sentiment-analysis"
    number: 02
    title: "Multi-Aspect Sentiment Analysis with Explainability"
    year: 2026
    type: "Project"
    summary: "An aspect-aware sentiment analysis application that goes beyond simple positive/negative classification and explains model predictions."
    details: "Built an NLP pipeline for customer reviews using TF-IDF with Logistic Regression, Naive Bayes, and Random Forest models. Integrated LIME for feature-level explanations and deployed an interactive Streamlit dashboard for review analysis, model comparison, and explainability-driven inspection."
    stack:
