projects:
  - slug: "vision-ui-testing"
    number: 01
    title: "Autonomous-web-UI-testing-as-MCP-tools-for-AI-agents"
    year: 2026
    type: "Featured Project"
    summary: "An autonomous web UI testing system that exposes browser exploration, test generation, execution, and evidence collection as MCP tools for AI agents."
    details: "Built as an independent rebuild and major extension of the capstone team's original architecture. I took the initial structure-based and vision-based direction as a starting point, redesigned the architecture, and rebuilt the implementation into a unified end-to-end system that connects live UI understanding, exploration, test generation, execution, and verdict evidence. Evaluated across 40 real websites with 98 functional tests generated and executed, 56 passed and 42 failed, all results classified; fusion-attributable coverage averaged 48.7% and reached 100% on some real sites. The system also underwent an independent adversarial audit and seeded-bug mutation study."
    stack:
      - "Python"
      - "Node.js"
      - "MCP"
      - "Playwright"
      - "YOLO"
      - "Tesseract OCR"
    link: "https://github.com/sandeep11mahendrakar/capstone"
    media:
      type: "image"
      src: "/projects/vision-ui-testing/preview.png"
      alt: "Autonomous web UI testing pipeline exposed as MCP tools for AI agents"

  - slug: "sentiment-analysis"
    number: 02
    title: "Lilly · Fashion Muse"
    year: 2026
    type: "Project"
    summary: "An aspect-aware fashion review sentiment system that combines sentiment prediction, confidence gating, and explainable review analysis."
    details: "Built an end-to-end review intelligence pipeline that scores fashion reviews on a 1–10 scale, predicts sentiment with an UNSURE / MIXED state for ambiguous cases, and supports aspect-aware analysis. The project includes a tuned DistilBERT model, an ABSA model, confidence-based selective prediction, and a FastAPI + JavaScript interface for single-review and batch-CSV scoring. Achieved 91.2% accuracy at 86.2% coverage with confidence gating, with 78.5% macro-F1 at the selected threshold versus 85.5% ungated accuracy."
    stack:
      - "Python"
      - "DistilBERT"
      - "ABSA"
      - "FastAPI"
      - "Hugging Face"
      - "Selective Prediction"
    link: "https://huggingface.co/"

  - slug: "huggingface-model-releases"
    number: 03
    title: "Open-Source Model Releases — Hugging Face"
    year: 2026
    type: "Model Release"
    summary: "Released two open-weight NLP models from Lilly · Fashion Muse: a confidence-gated sentiment model and an aspect-based sentiment analysis model."
    details: "The release packages the trained models for reproducible use outside the project: one document-gated review-sentiment model designed to abstain on ambiguous inputs, and one ABSA model for aspect-level sentiment analysis. Both are released as open-weight models on Hugging Face."
    stack:
      - "DistilBERT"
      - "ABSA"
      - "Hugging Face"
      - "Selective Prediction"
      - "Python"
    link: "https://huggingface.co/"

  - slug: "rag-answer-engine"
