    number: 01
    title: "AI-Assisted Test Case Generation for Mobile and Web UI Applications"
    year: 2026
    summary: "A dual-architecture system that generates structured test cases from web and mobile interfaces using structure-based and vision-based UI understanding."
    details: "The system combines DOM/View Hierarchy extraction with a vision pipeline using YOLO and OCR on screenshots. Gemini and Grok APIs are used to generate structured JSON test cases, which are converted into executable Playwright and Appium scripts for web and Android workflows."
